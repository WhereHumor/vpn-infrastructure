name: Validate Configs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check YAML syntax
        run: |
          pip install yamllint
          # Проверяем только чистые YAML файлы, игнорируя папки с шаблонами (.j2)
          # Используем наш конфиг .yamllint, если он есть
          if [ -f .yamllint ]; then
            yamllint -c .yamllint ansible/playbook.yml ansible/remnawave-playbook.yml
          else
            yamllint ansible/playbook.yml ansible/remnawave-playbook.yml
          fi

      - name: Validate Ansible Syntax
        run: |
          pip install ansible
          # Проверяем, что плейбуки синтаксически верны и Jinja2 шаблоны собираются
          cd ansible
          ansible-playbook -i inventory.ini.example playbook.yml --syntax-check
          ansible-playbook -i inventory.ini.example remnawave-playbook.yml --syntax-check

